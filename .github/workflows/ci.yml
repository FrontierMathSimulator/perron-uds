name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install reproducibility dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Run exact reproducer and tests
        run: python reproducibility/reproduce.py
      - uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2
        with:
          version: "1.10.18"
      - name: Build HTML, PDF, and Markdown editions
        run: bash scripts/build-paper.sh
      - name: Validate publication artifacts
        run: python scripts/validate-publication.py
